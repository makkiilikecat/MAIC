Attention:
  入力が、他のトークンに対してどの程度注意を向ける(質問をするようなもの)かを計算する。

MLP_MultiplayerPerceptron:
  入力をどう変化させれば他のにゅうｒ意味を持つことが出来るかを計算する。

SoftMax:
  入力を正規化する。
  入力は-1~1ではなく、-無限大から無限大までなので、これを適切にスケールして-1~1に変換する。
  tempretureを使って、分布を極端にしたり平均化したりを制御することができる。今回は実装していない。